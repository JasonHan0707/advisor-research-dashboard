<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fubing and Supervisor's Platform</title>
<style>
:root{--green:#287a59;--green-light:#e8f3ed;--ink:#203129;--muted:#77827b;--line:#e4eae5;--bg:#f4f7f4;--red:#c65050}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:18px}
header h1{margin:0;font-size:21px}
.subtitle,.muted{color:var(--muted)}
.subtitle{font-size:12px}
main{max-width:1180px;margin:26px auto;padding:0 20px 30px}
.tabs,.toolbar,.actions,.split{display:flex;align-items:center;gap:8px}
.tabs{margin-bottom:20px}
.tabs button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 13px}
.tabs button.active,.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.split{justify-content:space-between}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px;margin-bottom:16px}
.card h2,.page-title{margin:0 0 14px;font-size:17px}
.page-title{font-size:21px}
.muted{font-size:12px}
.row{border-top:1px solid #edf0ed;padding:12px 0}
.row:first-of-type{border-top:0}
.tag{display:inline-block;border-radius:20px;background:var(--green-light);color:var(--green);padding:3px 8px;font-size:11px}
.issue-title{font-weight:650}
.issue-actions button,.mini{border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 8px;color:var(--ink)}
.confirm-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;border-top:1px solid #edf0ed;padding:12px 0}
.status{font-size:21px;color:#aab3ad;line-height:1}
.status.yes{color:#319262}
.status.no{color:var(--red)}
.meeting{border-top:1px solid #edf0ed;padding:12px 0}
.meeting:first-of-type{border-top:0}
.numbered-item{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:start;border-top:1px solid #edf0ed;padding:10px 0}
.numbered-item:first-child{border-top:0}
.number{font-weight:700;color:var(--green)}
.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#10201888;z-index:10}
.modal.open{display:grid}
.dialog{width:min(540px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 20px 60px #0002}
.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dialog-head h2{margin:0;font-size:18px}
.close{border:0;background:transparent;color:var(--muted);font-size:22px}
.field{margin:12px 0}
.field label{display:block;margin-bottom:5px;font-size:12px;font-weight:650}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;color:var(--ink);background:#fff}
.field textarea{min-height:90px;resize:vertical}
.dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty{color:var(--muted);padding:15px 0;font-size:13px}
#login-panel{max-width:430px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
#login-panel h1{font-size:22px;margin:0 0 5px}
.error{color:var(--red);font-size:13px;min-height:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;background:#203129;border-radius:8px;padding:10px 15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:760px){
  header{align-items:flex-start;flex-direction:column}
  .grid{grid-template-columns:1fr}
  .tabs{overflow-x:auto}
  .tabs button{white-space:nowrap}
  main{margin-top:18px;padding:0 13px 24px}
}
</style>
</head>
<body>

<section id="login-panel">
  <h1>Fubing and Supervisor's Platform</h1>
  <div class="muted">请使用已创建的 Supabase 账号登录</div>
  <form id="login-form">
    <div class="field">
      <label for="login-email">邮箱</label>
      <input id="login-email" type="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">密码</label>
      <input id="login-password" type="password" required autocomplete="current-password">
    </div>
    <button class="btn primary" type="submit">登录</button>
    <div id="login-error" class="error"></div>
  </form>
</section>

<div id="app-shell" hidden>
  <header>
    <div>
      <h1>Fubing and Supervisor's Platform</h1>
      <div class="subtitle">博士生与导师的研究协作空间</div>
    </div>
    <div class="toolbar">
      <span class="subtitle" id="signed-in-user"></span>
      <button class="btn" onclick="signOut()">退出登录</button>
      <button class="btn primary" onclick="openIssue()">＋ 新建 Issue</button>
    </div>
  </header>

  <main>
    <nav class="tabs">
      <button class="active" data-view="overview">总览</button>
      <button data-view="issues">Issues</button>
      <button data-view="meetings">会议记录</button>
      <button data-view="confirmations">状态确认</button>
    </nav>

    <h2 class="page-title" id="page-title">研究进度总览</h2>

    <section class="view" id="overview">
      <div class="grid">
        <div>
          <section class="card">
            <div class="split">
              <div>
                <h2>研究进度</h2>
                <div class="muted">按完成顺序记录阶段性成果</div>
              </div>
              <button class="btn primary" onclick="openCompleted()">＋ 添加已完成内容</button>
            </div>
            <div id="completed-list"></div>
          </section>

          <section class="card">
            <div class="split">
              <h2>最近的 Issues</h2>
              <button class="btn" onclick="switchView('issues')">查看全部</button>
            </div>
            <div id="recent-issues"></div>
          </section>
        </div>

        <div>
          <section class="card">
            <div class="split">
              <div>
                <h2>待确认事项</h2>
                <div class="muted">灰色 ○ 未确认 · 绿色 ✓ 已确认 · 红色 × 不确认</div>
              </div>
              <button class="btn" onclick="openConfirmation()">＋ 新增</button>
            </div>
            <div id="overview-confirmations"></div>
          </section>

          <section class="card">
            <div class="split">
              <h2>最近会议</h2>
              <button class="btn" onclick="openMeeting()">＋ 记录会议</button>
            </div>
            <div id="recent-meetings"></div>
          </section>
        </div>
      </div>
    </section>

    <section class="view" id="issues" hidden>
      <section class="card">
        <div class="split">
          <div>
            <h2>Issue 工作台</h2>
            <div class="muted">记录研究问题、任务和想法；不设置负责人或期限</div>
          </div>
          <button class="btn primary" onclick="openIssue()">＋ 新建 Issue</button>
        </div>
        <div id="all-issues"></div>
      </section>
    </section>

    <section class="view" id="meetings" hidden>
      <section class="card">
        <div class="split">
          <div>
            <h2>会议记录</h2>
            <div class="muted">记录讨论结论和会后安排</div>
          </div>
          <button class="btn primary" onclick="openMeeting()">＋ 记录会议</button>
        </div>
        <div id="all-meetings"></div>
      </section>
    </section>

    <section class="view" id="confirmations" hidden>
      <section class="card">
        <div class="split">
          <div>
            <h2>状态确认</h2>
            <div class="muted">未确认 ○ · 已确认 ✓ · 不确认 ×</div>
          </div>
          <button class="btn primary" onclick="openConfirmation()">＋ 新增确认事项</button>
        </div>
        <div id="all-confirmations"></div>
      </section>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="dialog">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="dialog-content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gbwqvrgovlyodzdpdgud.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nFLH_i3DJlvAYHnlWi9_nQ_2cTbhxHV";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let items = [];
let currentUser = null;
let currentRole = null;
let realtimeChannel = null;

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);
}

function rowsOf(type) {
  return items.filter(item => item.type === type);
}

function itemDetails(item) {
  return item?.details || {};
}

function showToast(message) {
  const node = document.getElementById("toast");
  node.textContent = message;
  node.classList.add("show");
  setTimeout(() => node.classList.remove("show"), 2200);
}

function showError(error) {
  console.error(error);
  showToast(error.message || "发生错误，请检查网络或权限设置");
}

async function loadItems() {
  const { data, error } = await db.from("workspace_items")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: true });

  if (error) {
    showError(error);
    return;
  }

  items = data || [];
  render();
}

async function saveItem(item, id = null) {
  const payload = {
    type: item.type,
    title: item.title || "",
    body: item.body || "",
    status: item.status || "open",
    details: item.details || {},
    sort_order: item.sort_order || 0
  };

  const result = id
    ? await db.from("workspace_items").update(payload).eq("id", id)
    : await db.from("workspace_items").insert(payload);

  if (result.error) {
    showError(result.error);
    return false;
  }

  await loadItems();
  return true;
}

async function deleteItem(id) {
  const { error } = await db.from("workspace_items").delete().eq("id", id);

  if (error) {
    showError(error);
    return false;
  }

  await loadItems();
  return true;
}

function render() {
  const completed = rowsOf("completed")
    .sort((a, b) => a.sort_order - b.sort_order);

  document.getElementById("completed-list").innerHTML = completed.length
    ? completed.map((item, index) => {
        const children = itemDetails(item).children || [];

        return `
          <div class="row">
            <div class="split">
              <div>
                <span class="number">${index + 1}.</span>
                <strong>${escapeHTML(item.title)}</strong>
              </div>
              <span class="actions">
                <button class="mini" title="编辑" onclick="openCompleted('${item.id}')">✏️</button>
                <button class="mini" onclick="removeItem('${item.id}')">删除</button>
              </span>
            </div>

            ${children.map((child, childIndex) => `
              <div class="numbered-item">
                <span class="number">${index + 1}.${childIndex + 1}</span>
                <span>${escapeHTML(child.text)}</span>
                <button class="mini" onclick="deleteChild('${item.id}', ${childIndex})">删除</button>
              </div>
            `).join("")}

            <button class="mini" onclick="openChild('${item.id}')">＋ 添加小成果</button>
          </div>`;
      }).join("")
    : '<div class="empty">还没有已完成内容，点击上方按钮添加。</div>';

  const issues = rowsOf("issue")
    .sort((a, b) => b.created_at.localeCompare(a.created_at));

  document.getElementById("recent-issues").innerHTML =
    issues.slice(0, 3).map(issueMarkup).join("") ||
    '<div class="empty">还没有 Issue。</div>';

  document.getElementById("all-issues").innerHTML =
    issues.map(issueMarkup).join("") ||
    '<div class="empty">还没有 Issue。</div>';

  const meetings = rowsOf("meeting")
    .sort((a, b) => b.created_at.localeCompare(a.created_at));

  document.getElementById("recent-meetings").innerHTML =
    meetings.slice(0, 2).map(meetingMarkup).join("") ||
    '<div class="empty">还没有会议记录。</div>';

  document.getElementById("all-meetings").innerHTML =
    meetings.map(meetingMarkup).join("") ||
    '<div class="empty">还没有会议记录。</div>';

  const confirmations = rowsOf("confirmation")
    .sort((a, b) => b.created_at.localeCompare(a.created_at));

  document.getElementById("overview-confirmations").innerHTML =
    confirmations.map(confirmationMarkup).join("") ||
    '<div class="empty">还没有确认事项。</div>';

  document.getElementById("all-confirmations").innerHTML =
    confirmations.map(confirmationMarkup).join("") ||
    '<div class="empty">还没有确认事项。</div>';
}

function issueMarkup(item) {
  const details = itemDetails(item);
  const fileLabels = (details.files || [])
    .map(name => `<span class="tag">📎 ${escapeHTML(name)}</span>`)
    .join(" ");

  return `<div class="row">
    <div class="split">
      <span class="issue-title">${escapeHTML(item.title)}</span>
      <span class="issue-actions">
        <button onclick="openIssue('${item.id}')">编辑</button>
        <button onclick="removeItem('${item.id}')">×</button>
      </span>
    </div>
    <p class="muted">${escapeHTML(item.body)}</p>
    <div class="actions">
      <span class="tag">${escapeHTML(details.kind || "研究任务")}</span>
      ${fileLabels}
    </div>
  </div>`;
}

function meetingMarkup(item) {
  const details = itemDetails(item);

  return `<div class="meeting">
    <div class="split">
      <strong>${escapeHTML(item.title)}</strong>
      <button class="mini" onclick="removeItem('${item.id}')">删除</button>
    </div>
    <div class="muted">${escapeHTML(details.date || "")}</div>
    <p>${escapeHTML(item.body)}</p>
    ${details.next
      ? `<div class="muted"><strong>下一步：</strong>${escapeHTML(details.next)}</div>`
      : ""}
  </div>`;
}

function confirmationMarkup(item) {
  const details = itemDetails(item);
  const status = item.status || "pending";
  const mark = status === "yes" ? "✓" : status === "no" ? "×" : "○";

  // 用记录创建者判断提出者，兼容旧记录里的“我”和“导师”。
  const mine = item.created_by
    ? item.created_by === currentUser?.id
    : details.from === "我" || details.from === currentRole;

  const originRole = mine
    ? currentRole
    : currentRole === "student" ? "supervisor" : "student";

  const proposer = mine
    ? "我"
    : originRole === "student" ? "学生" : "导师";

  const target = mine
    ? currentRole === "student" ? "导师" : "学生"
    : "我";

  const label = status === "pending"
    ? `${proposer}提出 · 待${target}确认`
    : `${proposer}提出 · ${status === "yes" ? "已确认" : "不确认"}`;

  const canRespond = status === "pending" && !mine;

  return `<div class="confirm-row">
    <span class="status ${status}">${mark}</span>
    <div>
      <strong>${escapeHTML(item.title)}</strong>
      <div class="muted">${label} · ${escapeHTML(details.date || "")}</div>
    </div>
    <span class="actions">
      ${canRespond ? `
        <button class="mini" onclick="setConfirmation('${item.id}','yes')">确认</button>
        <button class="mini" onclick="setConfirmation('${item.id}','no')">不确认</button>
      ` : ""}
      <button class="mini" onclick="removeItem('${item.id}')">删除</button>
    </span>
  </div>`;
}

async function startApp(user) {
  const { data: member, error } = await db
    .from("workspace_members")
    .select("role")
    .eq("email", user.email)
    .maybeSingle();

  if (error || !member) {
    document.getElementById("login-error").textContent =
      "此账号还没有加入工作区成员名单。";
    await db.auth.signOut();
    return;
  }

  currentUser = user;
  currentRole = member.role;

  document.getElementById("login-panel").hidden = true;
  document.getElementById("app-shell").hidden = false;
  document.getElementById("signed-in-user").textContent = user.email || "";

  await loadItems();

  if (realtimeChannel) await db.removeChannel(realtimeChannel);
  realtimeChannel = db.channel("workspace-items-live")
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "workspace_items"
    }, () => loadItems())
    .subscribe();
}

document.getElementById("login-form").addEventListener("submit", async event => {
  event.preventDefault();

  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errorNode = document.getElementById("login-error");
  errorNode.textContent = "正在登录…";

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    errorNode.textContent = error.message;
    return;
  }

  errorNode.textContent = "";
  await startApp(data.user);
});

async function signOut() {
  if (realtimeChannel) await db.removeChannel(realtimeChannel);
  await db.auth.signOut();

  currentUser = null;
  currentRole = null;

  document.getElementById("app-shell").hidden = true;
  document.getElementById("login-panel").hidden = false;
}

async function removeItem(id) {
  if (!confirm("确定删除这条内容吗？")) return;
  await deleteItem(id);
}

function switchView(viewName) {
  document.querySelectorAll(".view").forEach(section => {
    section.hidden = section.id !== viewName;
  });

  document.querySelectorAll(".tabs button").forEach(button => {
    button.classList.toggle("active", button.dataset.view === viewName);
  });

  const titles = {
    overview: "研究进度总览",
    issues: "Issue 工作台",
    meetings: "会议记录",
    confirmations: "状态确认"
  };

  document.getElementById("page-title").textContent = titles[viewName];
}

document.querySelectorAll(".tabs button").forEach(button => {
  button.addEventListener("click", () => switchView(button.dataset.view));
});

function showModal(title, content) {
  document.getElementById("dialog-title").textContent = title;
  document.getElementById("dialog-content").innerHTML = content;
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

document.getElementById("modal").addEventListener("click", event => {
  if (event.target.id === "modal") closeModal();
});

function openCompleted(id = null) {
  const item = id ? items.find(x => x.id === id) : null;

  showModal(item ? "编辑阶段成果" : "添加已完成内容", `
    <div class="field">
      <label for="completed-text">阶段成果</label>
      <textarea id="completed-text" placeholder="例如：完成核心文献初步筛选">${escapeHTML(item?.title || "")}</textarea>
    </div>
    <div class="dialog-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveCompleted('${id || ""}')">保存</button>
    </div>`);
}

async function saveCompleted(id) {
  const title = document.getElementById("completed-text").value.trim();
  if (!title) return showToast("请填写阶段成果");

  const oldItem = id ? items.find(x => x.id === id) : null;

  if (oldItem) {
    const updated = await saveItem({
      ...oldItem,
      title,
      details: itemDetails(oldItem)
    }, id);

    if (!updated) return;
  } else {
    const order = rowsOf("completed")
      .reduce((max, item) => Math.max(max, item.sort_order), 0) + 1;

    const saved = await saveItem({
      type: "completed",
      title,
      sort_order: order,
      details: { children: [] }
    });

    if (!saved) return;
  }

  closeModal();
  showToast("阶段成果已同步");
}

function openChild(parentId) {
  showModal("添加小成果", `
    <div class="field">
      <label for="child-text">小成果内容</label>
      <textarea id="child-text" placeholder="写下这个阶段完成的一项具体内容"></textarea>
    </div>
    <div class="dialog-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveChild('${parentId}')">添加</button>
    </div>`);
}

async function saveChild(parentId) {
  const text = document.getElementById("child-text").value.trim();
  if (!text) return showToast("请填写小成果内容");

  const parent = items.find(item => item.id === parentId);
  if (!parent) return showToast("找不到所属阶段成果");

  const details = itemDetails(parent);
  const children = [...(details.children || []), { text }];

  const saved = await saveItem({
    ...parent,
    details: { ...details, children }
  }, parentId);

  if (!saved) return;

  closeModal();
  showToast("小成果已同步");
}

async function deleteChild(parentId, childIndex) {
  if (!confirm("确定删除这条小成果吗？")) return;

  const parent = items.find(item => item.id === parentId);
  if (!parent) return;

  const details = itemDetails(parent);
  const children = [...(details.children || [])];
  children.splice(childIndex, 1);

  await saveItem({
    ...parent,
    details: { ...details, children }
  }, parentId);
}

function openIssue(id = null) {
  const item = id ? items.find(x => x.id === id) : null;
  const details = itemDetails(item || {});

  showModal(item ? "编辑 Issue" : "新建 Issue", `
    <div class="field">
      <label for="issue-title">标题</label>
      <input id="issue-title" value="${escapeHTML(item?.title || "")}" placeholder="简要描述问题、任务或想法">
    </div>
    <div class="field">
      <label for="issue-body">内容</label>
      <textarea id="issue-body" placeholder="补充背景、进展或需要讨论的内容">${escapeHTML(item?.body || "")}</textarea>
    </div>
    <div class="field">
      <label for="issue-kind">类型</label>
      <select id="issue-kind">
        ${["研究任务","需要讨论","研究想法","遇到阻塞"].map(kind =>
          `<option ${kind === (details.kind || "研究任务") ? "selected" : ""}>${kind}</option>`
        ).join("")}
      </select>
    </div>
    <div class="field">
      <label for="issue-files">附件</label>
      <input id="issue-files" type="file" multiple>
      <div class="muted">本版先同步附件文件名，实际文件上传会在下一步接入。</div>
    </div>
    <div class="dialog-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveIssue('${id || ""}')">保存 Issue</button>
    </div>`);
}

async function saveIssue(id) {
  const title = document.getElementById("issue-title").value.trim();
  if (!title) return showToast("请填写 Issue 标题");

  const old = id ? items.find(x => x.id === id) : null;
  const chosen = Array.from(document.getElementById("issue-files").files)
    .map(file => file.name);

  const details = {
    kind: document.getElementById("issue-kind").value,
    files: chosen.length ? chosen : (itemDetails(old || {}).files || [])
  };

  const ok = await saveItem({
    type: "issue",
    title,
    body: document.getElementById("issue-body").value.trim(),
    details
  }, id || null);

  if (ok) {
    closeModal();
    showToast("Issue 已同步");
  }
}

function openMeeting() {
  showModal("记录会议", `
    <div class="field">
      <label for="meeting-title">会议名称</label>
      <input id="meeting-title" placeholder="例如：每周进度讨论">
    </div>
    <div class="field">
      <label for="meeting-body">讨论内容与结论</label>
      <textarea id="meeting-body" placeholder="记录讨论重点、导师建议和决定"></textarea>
    </div>
    <div class="field">
      <label for="meeting-next">会后安排</label>
      <textarea id="meeting-next" placeholder="每项安排一行"></textarea>
    </div>
    <div class="dialog-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveMeeting()">保存会议</button>
    </div>`);
}

async function saveMeeting() {
  const title = document.getElementById("meeting-title").value.trim();
  if (!title) return showToast("请填写会议名称");

  const body = document.getElementById("meeting-body").value.trim();
  const next = document.getElementById("meeting-next").value.trim();

  const ok = await saveItem({
    type: "meeting",
    title,
    body,
    details: {
      date: new Date().toLocaleDateString("zh-CN"),
      next
    }
  });

  if (!ok) return;

  if (next) {
    for (const text of next.split("\n").map(x => x.trim()).filter(Boolean)) {
      await saveItem({
        type: "confirmation",
        title: text,
        status: "pending",
        details: { from: currentRole, date: "刚刚" }
      });
    }
  }

  await loadItems();
  closeModal();
  showToast("会议和会后安排已同步");
}

function openConfirmation() {
  const target = currentRole === "student" ? "导师" : "我";

  showModal("新增确认事项", `
    <div class="muted">发布后由${target}确认</div>
    <div class="field">
      <label for="confirmation-text">事项内容</label>
      <textarea id="confirmation-text" placeholder="写下需要对方确认的安排、决定或想法"></textarea>
    </div>
    <div class="dialog-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveConfirmation()">发布</button>
    </div>`);
}

async function saveConfirmation() {
  const title = document.getElementById("confirmation-text").value.trim();
  if (!title) return showToast("请填写确认事项");

  const saved = await saveItem({
    type: "confirmation",
    title,
    status: "pending",
    details: {
      from: currentRole,
      date: "刚刚"
    }
  });

  if (saved) {
    closeModal();
    showToast("确认事项已同步");
  }
}

async function setConfirmation(id, status) {
  const item = items.find(x => x.id === id);
  if (!item) return;

  if (item.created_by === currentUser.id) {
    showToast("这条事项需要由对方确认");
    return;
  }

  const ok = await saveItem({ ...item, status }, id);
  if (ok) showToast(status === "yes" ? "已确认" : "已标记为不确认");
}

(async function init() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    document.getElementById("login-error").textContent = error.message;
    return;
  }

  if (data.session) {
    await startApp(data.session.user);
  }
})();
</script>
</body>
</html>
